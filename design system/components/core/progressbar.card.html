<!-- @dsCard group="Components" viewport="700x160" name="Progress Bar" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" data-theme="light" style="font-family:'Hanken Grotesk',sans-serif;background:var(--bg);padding:20px;width:660px;"></div>
<script type="text/babel">
const { ProgressBar } = window.Ledger;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{display:'flex', flexDirection:'column', gap:16}}>
    <div><div style={{fontSize:13, marginBottom:6, color:'var(--ink2)'}}>Groceries — on track</div><ProgressBar value={420} max={600} color="var(--cat-groc)" /></div>
    <div><div style={{fontSize:13, marginBottom:6, color:'var(--ink2)'}}>Shopping — over budget</div><ProgressBar value={310} max={300} color="var(--cat-shop)" /></div>
  </div>
);
</script>
