<!-- @dsCard group="Components" viewport="700x160" name="Stat Card" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" data-theme="light" style="font-family:'Hanken Grotesk',sans-serif;background:var(--bg);padding:20px;"></div>
<script type="text/babel">
const { StatCard } = window.Ledger;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:14, width:640}}>
    <StatCard label="Income" value="$4,200.00" tone="positive" />
    <StatCard label="Spent" value="$2,620.00" tone="negative" />
    <StatCard label="Net worth" value="$11,727.73" tone="neutral" />
  </div>
);
</script>
