<!-- @dsCard group="Colors" viewport="700x220" subtitle="Base surfaces & ink, light theme" name="Surfaces (Light)" -->
<link rel="stylesheet" href="../styles.css">
<div data-theme="light" style="font-family:'Hanken Grotesk',sans-serif;background:var(--bg);padding:20px;display:flex;gap:10px;flex-wrap:wrap;">
  <div style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink2);">
    <div style="width:120px;height:70px;border-radius:10px;background:var(--bg);border:1px solid var(--line);"></div>bg
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink2);">
    <div style="width:120px;height:70px;border-radius:10px;background:var(--surface);border:1px solid var(--line);"></div>surface
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink2);">
    <div style="width:120px;height:70px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);"></div>surface2
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink2);">
    <div style="width:120px;height:70px;border-radius:10px;background:var(--sidebar);border:1px solid var(--line);"></div>sidebar
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink2);">
    <div style="width:120px;height:70px;border-radius:10px;background:var(--ink);"></div>ink
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink2);">
    <div style="width:120px;height:70px;border-radius:10px;background:var(--ink2);"></div>ink2
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink2);">
    <div style="width:120px;height:70px;border-radius:10px;background:var(--muted);"></div>muted
  </div>
</div>
