<!-- @dsCard group="Spacing" viewport="700x180" subtitle="Hero/banner cards use a soft warm shadow; most cards use a hairline border only" name="Elevation" -->
<link rel="stylesheet" href="../styles.css">
<div data-theme="light" style="font-family:'Hanken Grotesk',sans-serif;background:var(--bg);padding:24px;display:flex;gap:20px;">
  <div style="flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:13px;color:var(--ink2);">Hairline card<br>(most surfaces)</div>
  <div style="flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow-card);font-size:13px;color:var(--ink2);">Shadow card<br>(hero/banner only)</div>
</div>
