<link rel="stylesheet" href="../styles.css">
<div data-theme="light" style="font-family:'Hanken Grotesk',sans-serif;background:var(--bg);padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:13px;color:var(--ink2);">
  <div style="display:flex;align-items:center;gap:8px;"><span style="width:16px;height:16px;border-radius:5px;background:var(--cat-groc);"></span>Groceries</div>
  <div style="display:flex;align-items:center;gap:8px;"><span style="width:16px;height:16px;border-radius:5px;background:var(--cat-dine);"></span>Dining</div>
  <div style="display:flex;align-items:center;gap:8px;"><span style="width:16px;height:16px;border-radius:5px;background:var(--cat-trans);"></span>Transport</div>
  <div style="display:flex;align-items:center;gap:8px;"><span style="width:16px;height:16px;border-radius:5px;background:var(--cat-shop);"></span>Shopping</div>
  <div style="display:flex;align-items:center;gap:8px;"><span style="width:16px;height:16px;border-radius:5px;background:var(--cat-fun);"></span>Fun</div>
  <div style="display:flex;align-items:center;gap:8px;"><span style="width:16px;height:16px;border-radius:5px;background:var(--cat-home);"></span>Housing</div>
  <div style="display:flex;align-items:center;gap:8px;"><span style="width:16px;height:16px;border-radius:5px;background:var(--cat-util);"></span>Utilities</div>
  <div style="display:flex;align-items:center;gap:8px;"><span style="width:16px;height:16px;border-radius:5px;background:var(--cat-sub);"></span>Subscriptions</div>
</div>
